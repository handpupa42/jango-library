{% extends 'base.html' %}

{% block title %}Список авторов{% endblock %}

{% block content %}
<h1 class="mb-4">Авторы</h1>

<div class="list-group">
    {% for author in authors %}
        <a href="{% url 'books:author_detail' author.pk %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
            <div>
                <h5 class="mb-1">{{ author }}</h5>
                {% if author.birth_date %}
                    <small class="text-muted">Дата рождения: {{ author.birth_date }}</small>
                {% endif %}
            </div>
            <span class="badge bg-primary rounded-pill">Подробнее &rarr;</span>
        </a>
    {% empty %}
        <div class="alert alert-warning">Авторов пока нет.</div>
    {% endfor %}
</div>
{% endblock %}
